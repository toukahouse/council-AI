version: '3.8'

services:
  council-ai:
    # Ganti 'username_github' dengan username asli Anda
    image: ghcr.io/username_github/council-ai:latest
    container_name: council-ai-app
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://nova:Swimer1789@db:5432/chatbot_db?schema=public
      # Tambahkan variabel .env Anda yang lain di sini
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: council-ai-db
    restart: always
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: Swimer1789
      POSTGRES_DB: chatbot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: